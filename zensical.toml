[project.theme]
variant = "modern"
language = "en"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight"
]

[project.theme.font]
text = "Manrope"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
primary = "slate"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "slate"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"
