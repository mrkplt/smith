global:
  environment: local
  rolloutId: ""
  imagePullSecrets: []
  featureFlags:
    loopPolicyConfig: true
    operatorOverrides: true
    auditStream: true
    interactiveAttach: false

etcd:
  endpoints:
    - http://etcd:2379
  tls:
    enabled: false
    caSecretName: ""
    certSecretName: ""

secrets:
  existingSecret: ""
  create: false
  managed:
    gitPat: ""
    runtimeCredentials: ""
    runtimeCredentialsClaude: ""
    # Claude Max (OAuth) credential file contents. When all three are set,
    # replica jobs for the Claude provider will use OAuth rather than ANTHROPIC_API_KEY.
    runtimeCredentialsClaudeMaxCredentialsJson: ""
    runtimeCredentialsClaudeMaxClaudeJson: ""
    runtimeCredentialsClaudeMaxSettingsJson: ""
  keys:
    gitPat: git_pat
    runtimeCredentials: runtime_credentials
    runtimeCredentialsClaude: runtime_credentials_claude
    claudeMaxCredentialsJson: claude_max_credentials_json
    claudeMaxClaudeJson: claude_max_claude_json
    claudeMaxSettingsJson: claude_max_settings_json

core:
  replicaCount: 1
  enabled: true
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
    scaleUpStabilizationWindowSeconds: 0
    scaleDownStabilizationWindowSeconds: 300
  image:
    repository: ghcr.io/smith/core
    tag: v0.6.0
    pullPolicy: IfNotPresent
  replicaImage:
    repository: ghcr.io/smith/replica
    tag: v0.6.0
    pullPolicy: IfNotPresent
  workspaceSeedImage:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
  loopPolicy:
    maxAttempts: 3
    backoffInitial: 5s
    backoffMax: 2m
    timeout: 30m
    terminateOnError: false
  replicaTemplate:
    serviceAccountName: ""
    resources: {}
    nodeSelector: {}
    tolerations: []
    env: []
  resources: {}
  env: []

api:
  replicaCount: 1
  enabled: true
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
    scaleUpStabilizationWindowSeconds: 0
    scaleDownStabilizationWindowSeconds: 300
  image:
    repository: ghcr.io/smith/api
    tag: v0.6.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  serviceAccount:
    create: true
    name: ""
  resources: {}
  featureFlags:
    tasks: false
    tasksKanban: false
    featureCapability: false
    providerClaude: true
    providerClaudeMax: false
    providerGemini: false
  documents:
    backend: etcd
    postgres:
      dsn: ""
      maxConns: 10
    garage:
      endpoint: ""
      region: us-east-1
      bucket: ""
      accessKeyId: ""
      secretAccessKey: ""
      forcePathStyle: true
    watchPollInterval: 2s
    migration:
      backfillOnStartup: true
      readThroughOnMiss: true
      mergeListFallback: true
      dualWriteEtcd: false
  env: []

documentDependencies:
  postgres:
    enabled: false
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    service:
      port: 5432
    auth:
      database: smith
      username: smith
    persistence:
      storageClassName: ""
      size: 10Gi
    resources: {}
  garage:
    enabled: false
    image:
      repository: dxflrs/garage
      tag: v2.2.0
      pullPolicy: IfNotPresent
    service:
      s3Port: 3900
      rpcPort: 3901
      adminPort: 3903
    config:
      replicationFactor: 1
      dbEngine: sqlite
      rpcSecret: CHANGE_ME_WITH_OPENSSL_HEX_32
      adminToken: CHANGE_ME_WITH_OPENSSL_BASE64_32
      metricsToken: CHANGE_ME_WITH_OPENSSL_BASE64_32
      region: us-east-1
      bucket: smith-documents
    persistence:
      storageClassName: ""
      size: 20Gi
    resources: {}
    bootstrap:
      enabled: false
      keyName: smith-documents-key
      zone: dc1
      capacity: 1G
      waitTimeout: 300s
      image:
        repository: alpine/k8s
        tag: 1.31.4
        pullPolicy: IfNotPresent
  credentials:
    existingSecret: ""
    create: false
    managed:
      postgresPassword: ""
      postgresDsn: ""
      garageAccessKeyId: ""
      garageSecretAccessKey: ""
    keys:
      postgresPassword: postgres_password
      postgresDsn: postgres_dsn
      garageAccessKeyId: garage_access_key_id
      garageSecretAccessKey: garage_secret_access_key

console:
  replicaCount: 1
  enabled: true
  apiBaseUrl: /api
  chatBaseUrl: /chat
  operatorPermissions: ""
  featureCapabilityAccess: false
  showComingSoonProviders: false
  featureFlags:
    tasks: false
    tasksKanban: false
    featureCapability: false
    chat: false
    integrations: false
    secrets: false
    providerClaude: true
    providerClaudeMax: false
    providerGemini: false
    prdDiagnosticResolve: false
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
    scaleUpStabilizationWindowSeconds: 0
    scaleDownStabilizationWindowSeconds: 300
  image:
    repository: ghcr.io/smith/console
    tag: v0.6.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  serviceAccount:
    create: true
    name: ""
  resources: {}
  env: []

chat:
  replicaCount: 1
  enabled: true
  goose:
    provider: ""
    model: ""
    apiKeyFromRuntimeSecret: true
    apiKeyEnvVar: OPENAI_API_KEY
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
    scaleUpStabilizationWindowSeconds: 0
    scaleDownStabilizationWindowSeconds: 300
  image:
    repository: ghcr.io/smith/chat
    tag: v0.6.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  serviceAccount:
    create: true
    name: ""
  resources: {}
  env: []

daemon:
  replicaCount: 1
  enabled: true
  image:
    repository: ghcr.io/smith/daemon
    tag: v0.6.0
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
  cleanup:
    interval: 10m
    timeout: 30s
    dryRun: false
    maxDeletes: 200
    retention:
      flatline: 48h
      cancelled: 48h
      synced: 0s
  resources: {}
  env: []

ingress:
  enabled: false

rbac:
  create: true

nameOverride: ""
fullnameOverride: ""
