apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smith.fullname" . }}-console
  labels:
    {{- include "smith.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      {{- include "smith.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      annotations:
        rollout-id: {{ .Values.global.rolloutId | default (randAlphaNum 5) | quote }}
      labels:
        {{- include "smith.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      {{- $runtimeSecretName := include "smith.runtimeSecretName" . }}
      {{- $consoleConfigName := printf "%s-console-config" (include "smith.fullname" .) }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smith.serviceAccountName" (dict "component" "console" "root" .) }}
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ .Values.console.image.tag }}"
          imagePullPolicy: {{ .Values.console.image.pullPolicy }}
          env:
            - name: SMITH_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_API_BASE_URL
            - name: SMITH_CHAT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_CHAT_BASE_URL
            - name: SMITH_OPERATOR_PERMISSIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_OPERATOR_PERMISSIONS
            - name: SMITH_FEATURE_TASKS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_FEATURE_TASKS_ENABLED
            - name: SMITH_FEATURE_CAPABILITY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_FEATURE_CAPABILITY_ENABLED
            - name: SMITH_FEATURE_CHAT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_FEATURE_CHAT_ENABLED
            - name: SMITH_FEATURE_SECRETS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_FEATURE_SECRETS_ENABLED
            - name: SMITH_FEATURE_CAPABILITY_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_FEATURE_CAPABILITY_ACCESS
            - name: SMITH_FEATURE_PROVIDER_CLAUDE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_FEATURE_PROVIDER_CLAUDE_ENABLED
            - name: SMITH_FEATURE_PROVIDER_GEMINI_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_FEATURE_PROVIDER_GEMINI_ENABLED
            - name: SMITH_FEATURE_PRD_DIAGNOSTIC_RESOLVE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_FEATURE_PRD_DIAGNOSTIC_RESOLVE_ENABLED
            - name: SMITH_SHOW_COMING_SOON_PROVIDERS
              valueFrom:
                configMapKeyRef:
                  name: {{ $consoleConfigName }}
                  key: SMITH_SHOW_COMING_SOON_PROVIDERS
            {{- if $runtimeSecretName }}
            - name: SMITH_RUNTIME_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecretName }}
                  key: {{ .Values.secrets.keys.runtimeCredentials }}
            {{- end }}
            {{- with .Values.console.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
