{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smith.runtimeSecretName" . }}
  labels:
    {{- include "smith.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.gitPat }}: {{ required "set secrets.managed.gitPat before deploy" .Values.secrets.managed.gitPat | quote }}
  {{ .Values.secrets.keys.runtimeCredentials }}: {{ required "set secrets.managed.runtimeCredentials before deploy" .Values.secrets.managed.runtimeCredentials | quote }}
  {{- if ne (trim .Values.secrets.managed.runtimeCredentialsClaude) "" }}
  {{ .Values.secrets.keys.runtimeCredentialsClaude }}: {{ .Values.secrets.managed.runtimeCredentialsClaude | quote }}
  {{- end }}
  {{- if ne (trim .Values.secrets.managed.runtimeCredentialsClaudeMaxCredentialsJson) "" }}
  {{ .Values.secrets.keys.claudeMaxCredentialsJson }}: {{ .Values.secrets.managed.runtimeCredentialsClaudeMaxCredentialsJson | quote }}
  {{ .Values.secrets.keys.claudeMaxClaudeJson }}: {{ .Values.secrets.managed.runtimeCredentialsClaudeMaxClaudeJson | quote }}
  {{ .Values.secrets.keys.claudeMaxSettingsJson }}: {{ .Values.secrets.managed.runtimeCredentialsClaudeMaxSettingsJson | quote }}
  {{- end }}
{{- end }}
