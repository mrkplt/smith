{{- $provider := trim (default "" .Values.chat.goose.provider) -}}
{{- $model := trim (default "" .Values.chat.goose.model) -}}
{{- if or (ne $provider "") (ne $model "") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smith.fullname" . }}-chat-config
  labels:
    {{- include "smith.labels" . | nindent 4 }}
data:
  {{- if ne $provider "" }}
  GOOSE_PROVIDER: {{ $provider | quote }}
  {{- end }}
  {{- if ne $model "" }}
  GOOSE_MODEL: {{ $model | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smith.fullname" . }}-chat
  labels:
    {{- include "smith.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  {{- if not .Values.chat.autoscaling.enabled }}
  replicas: {{ .Values.chat.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "smith.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: chat
  template:
    metadata:
      annotations:
        rollout-id: {{ .Values.global.rolloutId | default (randAlphaNum 5) | quote }}
      labels:
        {{- include "smith.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: chat
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smith.serviceAccountName" (dict "component" "chat" "root" .) }}
      containers:
        - name: chat
          image: "{{ .Values.chat.image.repository }}:{{ .Values.chat.image.tag }}"
          imagePullPolicy: {{ .Values.chat.image.pullPolicy }}
          args:
            - "--etcd-endpoints={{ join "," .Values.etcd.endpoints }}"
            - "--port={{ .Values.chat.service.port }}"
            - '--api-url=http://{{ include "smith.fullname" . }}-api:{{ .Values.api.service.port }}'
          envFrom:
            - configMapRef:
                name: {{ include "smith.fullname" . }}-chat-config
                optional: true
          env:
            {{- if and .Values.chat.goose.apiKeyFromRuntimeSecret (include "smith.runtimeSecretName" .) }}
            - name: {{ .Values.chat.goose.apiKeyEnvVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "smith.runtimeSecretName" . }}
                  key: {{ .Values.secrets.keys.runtimeCredentials }}
                  optional: true
            {{- if .Values.secrets.keys.runtimeCredentialsClaude }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "smith.runtimeSecretName" . }}
                  key: {{ .Values.secrets.keys.runtimeCredentialsClaude }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- with .Values.chat.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.chat.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.chat.resources | nindent 12 }}
