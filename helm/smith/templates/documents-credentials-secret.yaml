{{- if and .Values.documentDependencies.credentials.create (not .Values.documentDependencies.credentials.existingSecret) }}
{{- $postgresPassword := .Values.documentDependencies.credentials.managed.postgresPassword -}}
{{- $postgresDSN := .Values.documentDependencies.credentials.managed.postgresDsn -}}
{{- if and .Values.documentDependencies.postgres.enabled (eq $postgresPassword "") -}}
{{- fail "set documentDependencies.credentials.managed.postgresPassword when documentDependencies.postgres.enabled=true" -}}
{{- end -}}
{{- if and (eq $postgresDSN "") .Values.documentDependencies.postgres.enabled -}}
{{- $postgresDSN = printf "postgres://%s:%s@%s-documents-postgres:%v/%s?sslmode=disable" .Values.documentDependencies.postgres.auth.username $postgresPassword (include "smith.fullname" .) .Values.documentDependencies.postgres.service.port .Values.documentDependencies.postgres.auth.database -}}
{{- end -}}
{{- if and (eq $postgresDSN "") (eq .Values.api.documents.backend "postgres-garage") -}}
{{- fail "set documentDependencies.credentials.managed.postgresDsn when api.documents.backend=postgres-garage and Postgres is external" -}}
{{- end -}}
{{- if and (eq .Values.api.documents.backend "postgres-garage") (eq .Values.documentDependencies.credentials.managed.garageAccessKeyId "") -}}
{{- fail "set documentDependencies.credentials.managed.garageAccessKeyId when api.documents.backend=postgres-garage" -}}
{{- end -}}
{{- if and (eq .Values.api.documents.backend "postgres-garage") (eq .Values.documentDependencies.credentials.managed.garageSecretAccessKey "") -}}
{{- fail "set documentDependencies.credentials.managed.garageSecretAccessKey when api.documents.backend=postgres-garage" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smith.documentsCredentialsSecretName" . }}
  labels:
    {{- include "smith.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.documentDependencies.credentials.keys.postgresPassword }}: {{ $postgresPassword | quote }}
  {{ .Values.documentDependencies.credentials.keys.postgresDsn }}: {{ $postgresDSN | quote }}
  {{ .Values.documentDependencies.credentials.keys.garageAccessKeyId }}: {{ .Values.documentDependencies.credentials.managed.garageAccessKeyId | quote }}
  {{ .Values.documentDependencies.credentials.keys.garageSecretAccessKey }}: {{ .Values.documentDependencies.credentials.managed.garageSecretAccessKey | quote }}
{{- end }}
