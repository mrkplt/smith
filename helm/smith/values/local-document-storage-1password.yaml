# Local overlay that enables in-cluster Postgres + Garage document storage
# using credentials sourced from a Kubernetes Secret created from 1Password.

secrets:
  create: false
  existingSecret: smith-runtime-external

api:
  featureFlags:
    providerClaude: true
    providerGemini: true
  documents:
    backend: postgres-garage
    postgres:
      maxConns: 10
    garage:
      endpoint: ""
      region: us-east-1
      bucket: smith-documents-staging
      forcePathStyle: true
    migration:
      backfillOnStartup: true
      readThroughOnMiss: true
      mergeListFallback: true
      dualWriteEtcd: true

console:
  featureFlags:
    providerClaude: true
    providerGemini: true

documentDependencies:
  postgres:
    enabled: true
    persistence:
      size: 10Gi
  garage:
    enabled: true
    config:
      replicationFactor: 1
      dbEngine: sqlite
      rpcSecret: 8af7ec5d3ee2483a0a48663f40f2975d2c373d3f54fd42f37000256a75b0146e
      adminToken: smith-local-garage-admin-token
      metricsToken: smith-local-garage-metrics-token
      region: us-east-1
      bucket: smith-documents-staging
    persistence:
      size: 20Gi
    bootstrap:
      enabled: true
      keyName: smith-documents-key
      zone: dc1
      capacity: 5G
  credentials:
    existingSecret: smith-stage-documents
