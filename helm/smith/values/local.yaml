global:
  environment: local
  featureFlags:
    interactiveAttach: true

ingress:
  enabled: true

etcd:
  endpoints:
    - http://smith-etcd.smith-system.svc.cluster.local:2379
    - http://smith-etcd-x-smith-system-x-smith-vc.smith-vcluster.svc.cluster.local:2379

secrets:
  create: true
  managed:
    gitPat: ""
    runtimeCredentials: ""
    runtimeCredentialsClaude: ""

core:
  replicaCount: 1
  image:
    repository: smith-core
    tag: local
    pullPolicy: Never
  replicaImage:
    repository: smith-replica
    tag: local
    pullPolicy: Never
  workspaceSeedImage:
    repository: smith-skills
    tag: local
    pullPolicy: Never
  loopPolicy:
    maxAttempts: 2
    backoffInitial: 2s
    backoffMax: 30s
    timeout: 20m
  replicaTemplate:
    serviceAccountName: ""
    env:
      - name: SMITH_REPLICA_LOG_LEVEL
        value: debug
api:
  replicaCount: 1
  image:
    repository: smith-api
    tag: local
    pullPolicy: Never
  featureFlags:
    tasks: true
    tasksKanban: true
    providerClaudeMax: true
console:
  replicaCount: 1
  image:
    repository: smith-console
    tag: local
    pullPolicy: Never
  featureFlags:
    tasks: true
    tasksKanban: true
    providerClaudeMax: true

chat:
  replicaCount: 1
  image:
    repository: smith-chat
    tag: local
    pullPolicy: Never

daemon:
  enabled: true
  replicaCount: 1
  image:
    repository: smith-daemon
    tag: local
    pullPolicy: Never
  serviceAccount:
    create: true
    name: ""
  cleanup:
    interval: 10m
    timeout: 30s
    dryRun: false
    maxDeletes: 200
    retention:
      flatline: 48h
      cancelled: 48h
      synced: 0s
  resources: {}
  env: []
